name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Isar + l10n)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Secrets are injected as a dart-define file so nothing lands in git.
      - name: Write dev env
        run: |
          cat > env/dev.json <<'JSON'
          {
            "FLAVOR": "dev",
            "SUPABASE_URL": "${{ secrets.SUPABASE_DEV_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_DEV_ANON_KEY }}"
          }
          JSON

      - name: Build debug APK (dev flavor)
        run: >
          flutter build apk --debug --flavor dev
          -t lib/main_dev.dart
          --dart-define-from-file=env/dev.json

  # Enable once the Apple Developer account exists. No code signing, so this
  # only proves the iOS build compiles.
  build-ios:
    if: false
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --no-codesign --flavor dev -t lib/main_dev.dart
