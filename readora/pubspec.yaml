name: readora
description: Readora — an AI-powered reading companion. Read more. Remember more.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# NOTE ON VERSIONS
# These constraints were written against the packages available at scaffold time.
# If `flutter pub get` cannot resolve, run:
#     flutter pub upgrade --major-versions
# and commit the resulting pubspec.lock. Prefer upgrading over loosening.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- state & navigation ---------------------------------------------------
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.2.0

  # --- backend --------------------------------------------------------------
  supabase_flutter: ^2.5.6

  # --- local storage (offline-first source of truth) ------------------------
  # Using isar_community (community-maintained fork of Isar 3.x).
  # Official isar ^3.1.0+1 is incompatible with Dart 3.4+ / Flutter 3.22+.
  # API is 100% identical — no Dart code changes required.
  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # --- platform & utility ---------------------------------------------------
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  mobile_scanner: ^5.1.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  purchases_flutter: ^10.9.1
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  uuid: ^4.4.0
  collection: ^1.18.0
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  isar_community_generator: ^3.1.0+1
  very_good_analysis: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true # builds l10n from lib/l10n/*.arb
  assets:
    - assets/images/
    - assets/icons/

  # Imported from the Claude Design export (--font-serif / --font-sans).
  # Bundled rather than fetched at runtime: Readora opens offline on first
  # launch, and a network font flashes fallback on the one screen that matters.
  # Do not hardcode a font family anywhere but tokens/readora_typography.dart.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600

# ---------------------------------------------------------------------------
# App icon + native splash screen — generated (not committed generated output,
# only the config + source art) by flutter_launcher_icons / flutter_native_splash.
#
# Source art in assets/icons/ is a PLACEHOLDER mark (see
# generate_brand_marks note in that commit) built directly from
# design_system/tokens/readora_colors.dart so it's genuinely on-brand while
# the real logo isn't final yet. Swap the four PNGs for real art later —
# nothing below needs to change when you do.
#
# After editing this section, regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F1EA"
  adaptive_icon_foreground: "assets/icons/app_icon_adaptive_fg.png"

flutter_native_splash:
  color: "#F6F1EA"
  color_dark: "#14120F"
  image: assets/icons/splash_logo.png
  image_dark: assets/icons/splash_logo_dark.png
  android_12:
    image: assets/icons/app_icon_adaptive_fg.png
    icon_background_color: "#F6F1EA"
    image_dark: assets/icons/app_icon_adaptive_fg.png
    icon_background_color_dark: "#14120F"
  android: true
  ios: true
  web: false
  fullscreen: true
