# Supabase CLI configuration.
# Local stack:  supabase start   |  Apply migrations:  supabase db reset
# Link to dev:  supabase link --project-ref <readora-dev-ref>

project_id = "readora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]           # catches confirmation emails locally
enabled = true
port = 54324

[auth]
enabled = true
site_url = "readora://auth-callback"
additional_redirect_urls = ["readora://auth-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true      # set false locally if you want instant signups
secure_password_change = true

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
[functions.book-search]
verify_jwt = true

[functions.ai-chat]
verify_jwt = true

[functions.ai-generate]
verify_jwt = true

# RevenueCat cannot present a Supabase JWT; this function authenticates with a
# shared secret in the Authorization header instead. See its source header.
[functions.revenuecat-webhook]
verify_jwt = false
